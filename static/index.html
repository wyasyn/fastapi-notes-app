<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastAPI Notes</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 2rem;
        max-width: 600px;
        margin: auto;
      }
      h1,
      h2 {
        text-align: center;
      }
      form,
      .note {
        margin-bottom: 1rem;
      }
      .note {
        padding: 1rem;
        border: 1px solid #ccc;
        border-radius: 6px;
      }
      input,
      button,
      textarea {
        width: 100%;
        padding: 0.5rem;
        margin: 0.5rem 0;
      }
    </style>
  </head>
  <body>
    <div id="auth-container">
      <h1>FastAPI Notes</h1>
      <h2 id="form-title">Login</h2>
      <div id="login-form">
        <input id="username" placeholder="Username" />
        <input id="password" type="password" placeholder="Password" />
        <button onclick="login()">Login</button>
      </div>
      <div id="register-form" style="display: none">
        <input id="reg-username" placeholder="Choose a username" />
        <input
          id="reg-password"
          type="password"
          placeholder="Choose a password"
        />
        <button onclick="registerUser()">Register</button>
      </div>
      <p id="toggle-text">
        Don't have an account? <a href="#" id="toggle-link">Register</a>
      </p>
    </div>

    <div id="notes-app" style="display: none">
      <button onclick="logout()">Logout</button>
      <h2>Your Notes</h2>
      <form onsubmit="addNote(); return false;">
        <textarea id="note-content" placeholder="Write a note..."></textarea>
        <button type="submit">Add Note</button>
      </form>
      <div id="notes-list"></div>
    </div>

    <script>
      let token = localStorage.getItem("token");
      const formTitle = document.getElementById("form-title");
      const loginFormElem = document.getElementById("login-form");
      const registerFormElem = document.getElementById("register-form");
      const toggleText = document.getElementById("toggle-text");

      document.getElementById("toggle-link").addEventListener("click", (e) => {
        e.preventDefault();
        toggleForms();
      });

      function toggleForms() {
        const isLogin = formTitle.textContent === "Login";
        formTitle.textContent = isLogin ? "Register" : "Login";
        loginFormElem.style.display = isLogin ? "none" : "block";
        registerFormElem.style.display = isLogin ? "block" : "none";
        toggleText.innerHTML = isLogin
          ? 'Already have an account? <a href="#" id="toggle-link">Login</a>'
          : 'Don\'t have an account? <a href="#" id="toggle-link">Register</a>';
        document
          .getElementById("toggle-link")
          .addEventListener("click", (e) => {
            e.preventDefault();
            toggleForms();
          });
      }

      function showApp() {
        const loggedIn = !!token;
        document.getElementById("auth-container").style.display = loggedIn
          ? "none"
          : "block";
        document.getElementById("notes-app").style.display = loggedIn
          ? "block"
          : "none";
      }

      async function registerUser() {
        const username = document.getElementById("reg-username").value;
        const password = document.getElementById("reg-password").value;
        const res = await fetch("/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        if (res.ok) {
          alert("Registration successful! Please log in.");
          toggleForms();
        } else {
          const data = await res.json();
          alert("Registration failed: " + (data.detail || res.statusText));
        }
      }

      async function login() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: `username=${encodeURIComponent(
            username
          )}&password=${encodeURIComponent(password)}`,
        });
        if (res.ok) {
          const data = await res.json();
          token = data.access_token;
          localStorage.setItem("token", token);
          showApp();
          fetchNotes();
        } else {
          alert("Login failed.");
        }
      }

      function logout() {
        token = null;
        localStorage.removeItem("token");
        showApp();
      }

      async function fetchNotes() {
        const res = await fetch("/notes", {
          headers: { Authorization: `Bearer ${token}` },
        });
        const notes = await res.json();
        const list = document.getElementById("notes-list");
        list.innerHTML = "";
        notes.forEach((note) => {
          const div = document.createElement("div");
          div.className = "note";
          div.innerHTML = `
          <p>${note.content}</p>
          <button onclick="deleteNote(${note.id})">Delete</button>
        `;
          list.appendChild(div);
        });
      }

      async function addNote() {
        const content = document.getElementById("note-content").value;
        const res = await fetch("/notes", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify({ content }),
        });
        if (res.ok) {
          document.getElementById("note-content").value = "";
          fetchNotes();
        } else {
          alert("Failed to add note.");
        }
      }

      async function deleteNote(id) {
        await fetch(`/notes/${id}`, {
          method: "DELETE",
          headers: { Authorization: `Bearer ${token}` },
        });
        fetchNotes();
      }

      // On page load
      showApp();
      if (token) fetchNotes();
    </script>
  </body>
</html>
